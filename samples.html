<style>
:root{--hover:#C8262E;--bg:#FAF7EF;--surface:#FEFCF7;--ink:#2E2E2C;--mute:#66645E;--rule:#E3DDD1;--grid:#EEE9DE;--band:#F2EBDB;--accent:#2B4A9B;--soft:#D5CEC0;--back:#DFE4EE;--backline:#D0D7E6;--display:'Geist',sans-serif;--body:'Geist',sans-serif;--mono:'Geist Mono',monospace;--dw:500;--dls:-0.025em}
html{background:var(--bg)}

body{margin:0}







.site{background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:70px 50px;color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.5;min-height:100vh;padding-bottom:80px}
.site.grid-wide{background-size:28px 20px}.site.grid-large{background-size:42px 30px}.site.grid-fine{background-size:14px 10px}
.site.grid-dots{background-image:radial-gradient(circle,var(--rule) 1px,transparent 1.6px);background-size:28px 20px;background-position:-14px -10px}
.site.grid-off{background-image:none}
.site a{color:var(--ink);text-decoration:none}
.site a:hover{color:var(--hover,var(--accent))}
.site a:focus-visible,.site button:focus-visible{outline:1px solid var(--accent);outline-offset:3px}
.mono{font-family:var(--mono);font-size:13px;color:var(--mute);letter-spacing:.01em}
.disp{font-family:var(--display);font-weight:var(--dw);letter-spacing:var(--dls)}
.num,.site header a.disp{font-family:'Doto',monospace;font-weight:900;letter-spacing:0}
.nav a,.nav button{position:relative;padding:6px 0;background:none;border:0;font:inherit;color:var(--ink);cursor:pointer}
.nav a::after,.nav button::after{content:"";position:absolute;left:0;right:0;bottom:2px;border-bottom:1px dashed var(--hover,var(--accent));transform:scaleX(0);transform-origin:left;transition:transform .35s ease}
.nav a:hover::after,.nav button:hover::after{transform:scaleX(1)}
.nav a[aria-current="page"]::after,.nav button[aria-pressed="true"]::after{transform:scaleX(1);border-bottom-style:solid;border-bottom-color:var(--accent)}
.ruler{height:8px;background-image:repeating-linear-gradient(90deg,var(--rule) 0 1px,transparent 1px 14px),repeating-linear-gradient(90deg,var(--mute) 0 1px,transparent 1px 140px);background-size:100% 4px,100% 8px;background-repeat:no-repeat;background-position:0 100%,0 100%;opacity:.7}
.hem{position:fixed;left:0;right:0;bottom:0;z-index:30;height:48px;background:var(--surface);border-top:1px solid var(--rule);overflow:hidden;transition:height .5s cubic-bezier(.65,0,.25,1)}
.hem::before{content:"";position:absolute;left:0;right:0;top:11px;height:1.5px;background-image:repeating-linear-gradient(90deg,var(--accent) 0 10px,transparent 10px 24px);opacity:.85;pointer-events:none}
.hem.open{height:132px}
.hemrow{max-width:1440px;margin:0 auto;padding:18px clamp(16px,4vw,48px) 0;display:flex;justify-content:space-between;align-items:center;gap:16px}
.hemtab{border:0;background:none;padding:4px 0;font-family:var(--mono);font-size:13px;color:var(--ink);cursor:pointer}
.hemtab:hover{color:var(--hover,var(--accent))}
.hemmail{font-family:var(--mono);font-size:13px}
.hemgrid{max-width:1440px;margin:0 auto;padding:18px clamp(16px,4vw,48px) 0;display:grid;grid-template-columns:repeat(2,minmax(0,220px));gap:12px 40px;visibility:hidden;transition:visibility 0s linear .5s}
.hem.open .hemgrid{visibility:visible;transition:visibility 0s}
.hem .k{display:block;font-family:var(--mono);font-size:11.5px;color:var(--mute)}
.btn{border:1px solid var(--rule);background:var(--surface);color:var(--ink);font-family:var(--mono);font-size:13px;min-height:38px;padding:0 13px;cursor:pointer}
.btn:hover{border-color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default;border-color:var(--rule)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.knit{background-color:var(--surface);background-image:linear-gradient(135deg,var(--grid) 25%,transparent 25%),linear-gradient(225deg,var(--grid) 25%,transparent 25%);background-size:14px 10px}
@media (max-width:820px){.head{grid-template-columns:minmax(0,1fr)!important}}
/* category tabs */
.tabs{display:flex;flex-wrap:wrap;gap:2px 28px;padding:12px 0 10px}
.tabs button{position:relative;border:0;background:none;padding:6px 0;font:inherit;font-size:15px;color:var(--mute);cursor:pointer}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-pressed="true"]{color:var(--ink)}
.tabs button[aria-pressed="true"]::after{content:"";position:absolute;left:0;right:0;bottom:2px;border-bottom:1.5px solid var(--accent)}
.tabs .cnt{font-family:var(--mono);font-size:11.5px;color:var(--mute);margin-left:5px;vertical-align:2px}
.tabs button.droptab{color:var(--hover);outline:2px dashed var(--hover);outline-offset:4px}
/* gallery */
.kgrid{display:grid;grid-auto-flow:row dense;grid-auto-rows:4px;align-items:start}
.kcard{position:relative;min-width:0}
.kframe{position:relative;display:block;width:100%;padding:0;border:0;overflow:hidden;cursor:zoom-in;box-shadow:0 0 0 1px var(--rule);transition:box-shadow .2s}
.kframe:hover{box-shadow:0 0 0 1px var(--ink)}
.rimg{position:absolute;display:block;overflow:hidden}
.rimg img{position:absolute;left:0;top:0;width:100%;height:100%;display:block;max-width:none;pointer-events:none;user-select:none;-webkit-user-drag:none}
.kcap{margin:8px 0 0;display:flex;gap:10px;align-items:baseline;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kcap .num{font-size:13px}
.ph{color:var(--mute)}

/* lightbox */
.lbx{position:fixed;inset:0;z-index:85;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px}
.lbframe{position:relative;overflow:hidden;box-shadow:0 0 0 1px var(--rule);max-width:100%}
.lbx[hidden]{display:none!important}
.lbx .btn{min-height:40px}
@media (max-width:700px){.site>header{position:relative!important}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

</style>
</head>

<div class="hemgrid"><span><span class="k">Phone</span><a href="tel:+353858715077">+353 85 871 5077</a></span><span><span class="k">Instagram</span><a href="https://www.instagram.com/benjfarrelly/">@benjfarrelly</a></span></div>
</div></div>

</body>
